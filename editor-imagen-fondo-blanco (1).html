<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editor de imagen sobre fondo blanco</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f3ef;
    color: #2c2c2a;
    margin: 0;
    padding: 2rem 1rem;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 680px;
    background: #ffffff;
    border: 0.5px solid #ddd9cd;
    border-radius: 12px;
    padding: 1.75rem;
  }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 0.25rem; }
  p.sub { font-size: 14px; color: #6b6a63; margin: 0 0 1.5rem; }
  .drop {
    border: 1.5px dashed #c7c3b5;
    border-radius: 10px;
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop:hover, .drop.drag { border-color: #99958a; background: #faf9f5; }
  .drop p { margin: 0; font-size: 14px; color: #6b6a63; }
  input[type="file"] { display: none; }
  .controls { display: none; margin-top: 1.5rem; }
  .controls.show { display: block; }

  .row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .row label { font-size: 14px; color: #6b6a63; width: 100px; flex-shrink: 0; }
  .row input[type="number"] {
    width: 100px; height: 36px; border: 0.5px solid #d3d1c7;
    border-radius: 8px; padding: 0 10px; font-size: 14px;
  }

  .hint {
    font-size: 13px;
    color: #6b6a63;
    margin: 0 0 0.75rem;
  }

  .stage-wrap {
    position: relative;
    border-radius: 10px;
    border: 0.5px solid #ddd9cd;
    background: #f4f3ef;
    margin: 12px;
  }
  .stage-clip {
    position: relative;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
  }
  .stage-img {
    position: absolute;
    left: 0;
    top: 0;
    cursor: move;
    user-select: none;
    -webkit-user-drag: none;
    outline: 1px dashed #b4b2a9;
    touch-action: none;
    z-index: 1;
  }
  .handle {
    position: absolute;
    width: 22px;
    height: 22px;
    right: -11px;
    bottom: -11px;
    cursor: nwse-resize;
    touch-action: none;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .handle::after {
    content: "";
    width: 14px;
    height: 14px;
    background: #2c2c2a;
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 1px #2c2c2a;
    pointer-events: none;
  }

  .actions { display: flex; gap: 10px; margin-top: 1.25rem; }
  button {
    height: 38px; padding: 0 16px; border-radius: 8px;
    border: 0.5px solid #d3d1c7; background: #fff; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #f4f3ef; }
  button.primary { background: #2c2c2a; color: #fff; border-color: #2c2c2a; }
  button.primary:hover { background: #444441; }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="app">
  <h1>Editor de imagen sobre fondo blanco</h1>
  <p class="sub">Sube tu imagen, arrástrala y usa el punto de la esquina para cambiar su tamaño dentro del lienzo blanco.</p>

  <div class="drop" id="drop">
    <p>Haz clic aquí o arrastra una imagen</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="controls" id="controls">
    <div class="row">
      <label for="canvasW">Ancho lienzo</label>
      <input type="number" id="canvasW" min="1">
      <label for="canvasH" style="width:auto; margin-left:8px;">Alto lienzo</label>
      <input type="number" id="canvasH" min="1">
    </div>

    <p class="hint">Arrastra la imagen para moverla. Usa el punto negro para cambiar su tamaño.</p>

    <div class="stage-wrap" id="stageWrap">
      <div class="stage-clip" id="stageClip">
        <img class="stage-img" id="stageImg" draggable="false">
      </div>
      <div class="handle" id="handle"></div>
    </div>

    <div class="actions">
      <button class="primary" id="downloadBtn">Descargar imagen</button>
      <button id="changeBtn">Cambiar imagen</button>
    </div>
  </div>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const controls = document.getElementById('controls');
const canvasWInput = document.getElementById('canvasW');
const canvasHInput = document.getElementById('canvasH');
const stageWrap = document.getElementById('stageWrap');
const stageClip = document.getElementById('stageClip');
const stageImg = document.getElementById('stageImg');
const handle = document.getElementById('handle');
const downloadBtn = document.getElementById('downloadBtn');
const changeBtn = document.getElementById('changeBtn');

let img = null;
let origW = 0, origH = 0;
let canvasW = 0, canvasH = 0;
let displayScale = 1; // ratio between on-screen stage size and true canvas px size

// state of the image, in TRUE canvas pixels
let imgX = 0, imgY = 0, imgW = 0, imgH = 0;
let aspect = 1;

const MAX_STAGE_WIDTH = 620;

drop.addEventListener('click', () => fileInput.click());
changeBtn.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('drag');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) loadFile(fileInput.files[0]);
});

function loadFile(file) {
  if (!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const image = new Image();
    image.onload = () => {
      img = image;
      origW = image.width;
      origH = image.height;
      aspect = origW / origH;

      canvasW = Math.round(origW * 1.4);
      canvasH = origH;
      canvasWInput.value = canvasW;
      canvasHInput.value = canvasH;

      imgW = origW;
      imgH = origH;
      imgX = (canvasW - imgW) / 2;
      imgY = (canvasH - imgH) / 2;

      stageImg.src = e.target.result;
      controls.classList.add('show');
      setupStage();
    };
    image.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

canvasWInput.addEventListener('input', () => {
  canvasW = Math.max(1, parseInt(canvasWInput.value) || canvasW);
  setupStage();
});
canvasHInput.addEventListener('input', () => {
  canvasH = Math.max(1, parseInt(canvasHInput.value) || canvasH);
  setupStage();
});

function setupStage() {
  displayScale = Math.min(1, MAX_STAGE_WIDTH / canvasW);
  const stageDispW = canvasW * displayScale;
  const stageDispH = canvasH * displayScale;
  stageWrap.style.width = stageDispW + 'px';
  stageWrap.style.height = stageDispH + 'px';
  stageClip.style.width = stageDispW + 'px';
  stageClip.style.height = stageDispH + 'px';
  renderPositions();
}

function renderPositions() {
  stageImg.style.width = (imgW * displayScale) + 'px';
  stageImg.style.height = (imgH * displayScale) + 'px';
  stageImg.style.transform = `translate(${imgX * displayScale}px, ${imgY * displayScale}px)`;
  handle.style.transform = `translate(${(imgX + imgW) * displayScale - 11}px, ${(imgY + imgH) * displayScale - 11}px)`;
}

// Dragging the image
let dragging = false, dragStartX = 0, dragStartY = 0, startImgX = 0, startImgY = 0;

stageImg.addEventListener('pointerdown', e => {
  dragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  startImgX = imgX;
  startImgY = imgY;
  stageImg.setPointerCapture(e.pointerId);
});
stageImg.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = (e.clientX - dragStartX) / displayScale;
  const dy = (e.clientY - dragStartY) / displayScale;
  imgX = startImgX + dx;
  imgY = startImgY + dy;
  renderPositions();
});
stageImg.addEventListener('pointerup', () => { dragging = false; });

// Resizing via handle (keeps aspect ratio)
let resizing = false, resizeStartX = 0, startW = 0, startH = 0;

handle.addEventListener('pointerdown', e => {
  e.stopPropagation();
  resizing = true;
  resizeStartX = e.clientX;
  startW = imgW;
  startH = imgH;
  handle.setPointerCapture(e.pointerId);
});
handle.addEventListener('pointermove', e => {
  if (!resizing) return;
  const dx = (e.clientX - resizeStartX) / displayScale;
  let newW = Math.max(10, startW + dx);
  let newH = newW / aspect;
  imgW = newW;
  imgH = newH;
  renderPositions();
});
handle.addEventListener('pointerup', () => { resizing = false; });

downloadBtn.addEventListener('click', () => {
  const canvas = document.createElement('canvas');
  canvas.width = canvasW;
  canvas.height = canvasH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasW, canvasH);
  ctx.drawImage(img, imgX, imgY, imgW, imgH);

  const link = document.createElement('a');
  link.download = 'imagen-editada.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>
</body>
</html>
